# Plantilla de Mosquitto con mTLS (autenticación mutua por certificados)
# Requiere generar antes la CA, el certificado del servidor y uno por cada cliente.
# Los archivos .crt, .key y passwd NO se suben al repositorio.

persistence true
persistence_location /var/lib/mosquitto/

log_dest file /var/log/mosquitto/mosquitto.log

per_listener_settings true

listener 8883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
require_certificate true
tls_version tlsv1.2
